
name: Morgengruss erzeugen

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
      timezone: "Europe/Berlin"

permissions:
  contents: write

concurrency:
  group: morgengruss
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Morgengruss erstellen
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPEN_AI_ZOERNER_API_KEY: ${{ secrets.OPEN_AI_ZOERNER_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          import urllib.parse
          from datetime import datetime
          from zoneinfo import ZoneInfo

          # ==================================
          # KONFIGURATION
          # ==================================

          VOICE_ID = "MJ0RnG71ty4LH3dvNfSd"
          OPENAI_MODEL = "gpt-5-mini"
          ELEVENLABS_MODEL = "eleven_multilingual_v2"

          LATITUDE = 50.4405
          LONGITUDE = 7.4017

          now = datetime.now(
              ZoneInfo("Europe/Berlin")
          )

          weekdays = [
              "Montag", "Dienstag", "Mittwoch",
              "Donnerstag", "Freitag",
              "Samstag", "Sonntag"
          ]

          months = [
              "Januar", "Februar", "März",
              "April", "Mai", "Juni",
              "Juli", "August", "September",
              "Oktober", "November", "Dezember"
          ]

          date_text = (
              f"{weekdays[now.weekday()]}, "
              f"der {now.day}. "
              f"{months[now.month - 1]} "
              f"{now.year}"
          )

          # ==================================
          # API HILFSFUNKTION
          # ==================================

          def api_request(url, data=None, headers=None):
              body = None

              if data is not None:
                  body = json.dumps(
                      data
                  ).encode("utf-8")

              request = urllib.request.Request(
                  url,
                  data=body,
                  headers=headers or {},
                  method="POST" if body else "GET"
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:
                      return response.read()

              except urllib.error.HTTPError as error:
                  print(
                      "API-Fehler:",
                      error.code
                  )

                  details = error.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print(
                      "Fehlerdetails:",
                      details
                  )

                  raise

          # ==================================
          # WETTER BESCHREIBEN
          # ==================================

          def weather_description(code):
              if code == 0:
                  return "sonnig oder klar"
              if code in (1, 2):
                  return "leicht bewölkt"
              if code == 3:
                  return "bedeckt"
              if code in (45, 48):
                  return "neblig"
              if code in (51, 53, 55, 56, 57):
                  return "Nieselregen"
              if code in (61, 63, 65, 66, 67):
                  return "Regen"
              if code in (71, 73, 75, 77):
                  return "Schnee"
              if code in (80, 81, 82):
                  return "Regenschauer"
              if code in (85, 86):
                  return "Schneeschauer"
              if code in (95, 96, 99):
                  return "Gewitter"
              return "wechselhaft"

          # ==================================
          # 1. WETTERDATEN ABRUFEN
          # ==================================

          params = {
              "latitude": LATITUDE,
              "longitude": LONGITUDE,
              "current": (
                  "temperature_2m,weather_code"
              ),
              "daily": (
                  "temperature_2m_max,"
                  "temperature_2m_min,"
                  "precipitation_probability_max,"
                  "weather_code"
              ),
              "timezone": "Europe/Berlin",
              "forecast_days": 1
          }

          weather_url = (
              "https://api.open-meteo.com/v1/forecast?"
              + urllib.parse.urlencode(params)
          )

          weather_text = (
              "Keine Wetterdaten verfügbar."
          )

          try:
              raw_weather = api_request(
                  weather_url
              )

              weather = json.loads(
                  raw_weather
              )

              current = weather["current"]
              daily = weather["daily"]

              temperature = current[
                  "temperature_2m"
              ]

              maximum = daily[
                  "temperature_2m_max"
              ][0]

              minimum = daily[
                  "temperature_2m_min"
              ][0]

              rain = daily[
                  "precipitation_probability_max"
              ][0]

              condition = weather_description(
                  daily["weather_code"][0]
              )

              current_condition = weather_description(
                  current["weather_code"]
              )

              weather_text = (
                  f"Aktuell {temperature} Grad, "
                  f"{current_condition}. "
                  f"Heute erwartet: {condition}. "
                  f"Maximum: {maximum} Grad. "
                  f"Minimum: {minimum} Grad. "
                  f"Maximale Regenwahrscheinlichkeit: "
                  f"{rain} Prozent."
              )

              print(
                  "Wetterdaten erfolgreich abgerufen"
              )
              print(weather_text)

          except Exception as error:
              print(
                  "Wetterdaten nicht verfügbar:",
                  str(error)
              )

          # ==================================
          # 2. GPT ERZEUGT DEN TEXT
          # ==================================

          prompt = f"""
          Du bist die freundliche Stimme eines
          Smart Homes in Andernach am Rhein.

          Heute ist {date_text}.

          Erstelle eine warme, angenehme,
          abwechslungsreiche Morgenansage
          für zwei Erwachsene.

          Die Ansage soll Folgendes enthalten:
          - Einen freundlichen Guten-Morgen-Gruß.
          - Den heutigen Wochentag und das Datum.
          - Eine kurze Wetterzusammenfassung.
          - Einen schönen Wunsch für den Tag.

          Wetterinformationen:
          {weather_text}

          Verwende ausschließlich die angegebenen
          Wetterdaten. Erfinde nichts hinzu.
          Wenn keine Wetterdaten vorhanden sind,
          lasse das Wetter vollständig weg.

          Stil:
          - Ruhig, natürlich und sympathisch.
          - Nicht übertrieben enthusiastisch.
          - Keine Floskeln einer Nachrichtensendung.
          - Gelegentlich etwas charmant.
          - Jeden Tag eine andere Formulierung.

          Länge:
          - Ideale Sprechdauer 15 bis 18 Sekunden.
          - Maximal ungefähr 20 Sekunden.
          - Halte den Text entsprechend kurz.
          - Keine langen Wetterberichte.
          - Höchstens ungefähr 40 gesprochene Wörter.

          Formuliere Datumsangaben und Temperaturen
          so, dass sie vorgelesen gut klingen.

          Antworte ausschließlich mit dem Text
          der Ansage.
          """

          openai_data = {
              "model": OPENAI_MODEL,
              "input": prompt,
              "reasoning": {
                  "effort": "minimal"
              },
              "max_output_tokens": 300
          }

          openai_url = (
              "https://api.openai.com/v1/responses"
          )

          raw_response = api_request(
              openai_url,
              data=openai_data,
              headers={
                  "Authorization": (
                      "Bearer "
                      + os.environ[
                          "OPEN_AI_ZOERNER_API_KEY"
                      ]
                  ),
                  "Content-Type": "application/json"
              }
          )

          result = json.loads(
              raw_response
          )

          text = " ".join(
              part["text"]
              for item in result.get("output", [])
              if item.get("type") == "message"
              for part in item.get("content", [])
              if part.get("type") == "output_text"
          ).strip()

          if not text:
              raise RuntimeError(
                  "OpenAI hat keinen Text erzeugt."
              )

          print("Generierter Morgengruss:")
          print(text)

          # ==================================
          # 3. ELEVENLABS ERZEUGT MP3
          # ==================================

          elevenlabs_url = (
              "https://api.elevenlabs.io/v1/"
              f"text-to-speech/{VOICE_ID}"
              "?output_format=mp3_44100_128"
          )

          audio_data = {
              "text": text,
              "model_id": ELEVENLABS_MODEL
          }

          audio = api_request(
              elevenlabs_url,
              data=audio_data,
              headers={
                  "xi-api-key": os.environ[
                      "ELEVENLABS_API_KEY"
                  ],
                  "Content-Type": "application/json"
              }
          )

          if not audio:
              raise RuntimeError(
                  "ElevenLabs lieferte keine Audiodaten."
              )

          is_mp3 = (
              audio.startswith(b"ID3")
              or (
                  len(audio) > 2
                  and audio[0] == 0xFF
                  and (audio[1] & 0xE0) == 0xE0
              )
          )

          if not is_mp3:
              raise RuntimeError(
                  "ElevenLabs lieferte keine MP3."
              )

          # ==================================
          # 4. DATEIEN SPEICHERN
          # ==================================

          with open(
              "morgengruss.mp3",
              "wb"
          ) as file:
              file.write(audio)

          with open(
              "morgengruss.txt",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(text + "\n")

          print(
              "MP3 und Text erfolgreich erstellt."
          )

          PY

      - name: Dateien committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add morgengruss.mp3 morgengruss.txt

          if ! git diff --cached --quiet; then
            git commit -m "Morgengruss aktualisiert"
            git pull --rebase
            git push
          fi

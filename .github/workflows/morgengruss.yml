

name: Morgengruss erzeugen

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
      timezone: 'Europe/Berlin'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: MP3 mit ElevenLabs erzeugen
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Europe/Berlin"))

          text = (
              f"Guten Morgen! Heute ist der "
              f"{now.strftime('%d.%m.%Y')}. "
              "Die automatische Sprachansage funktioniert!"
          )

          voice_id = "MJ0RnG71ty4LH3dvNfSd"

          url = (
              "https://api.elevenlabs.io/v1/"
              f"text-to-speech/{voice_id}"
          )

          data = json.dumps({
              "text": text,
              "model_id": "eleven_multilingual_v2"
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=data,
              headers={
                  "xi-api-key": os.environ["ELEVENLABS_API_KEY"],
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=60) as response:
              audio = response.read()

          with open("morgengruss.mp3", "wb") as file:
              file.write(audio)

          print("MP3 erfolgreich erzeugt")

          PY

      - name: MP3 auf GitHub speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add morgengruss.mp3

          if ! git diff --cached --quiet; then
            git commit -m "Morgengruss aktualisiert"
            git push
          fi
